# PostgreSQL host-based authentication
#
# Unix socket: password auth (container-internal only)
# All TCP connections: password auth + SSL required
#
# Docker Desktop for Mac proxies port-mapped connections through
# unpredictable IPs, so we enforce SSL uniformly on all TCP.

# Unix socket (container-internal)
local   all   all                  scram-sha-256

# All TCP connections — SSL required
hostssl all   all   0.0.0.0/0      scram-sha-256
hostssl all   all   ::0/0          scram-sha-256
