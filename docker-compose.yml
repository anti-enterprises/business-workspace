services:
  postgres:
    image: postgres:17-alpine
    container_name: business-workspace-db
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # scram-sha-256 is the default in PG17, but be explicit
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      # 5433 avoids conflicts with any local postgres on 5432
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./execution/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./certs/server.crt:/var/lib/postgresql/certs/server.crt:ro
      - ./certs/server.key:/var/lib/postgresql/certs/server.key:ro
      - ./scripts/pg_hba_external.conf:/etc/postgresql/pg_hba_external.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Allow connections from any IP (Docker default, but explicit)
    command: >
      postgres
        -c listen_addresses='*'
        -c log_connections=on
        -c log_disconnections=on
        -c ssl=on
        -c ssl_cert_file='/var/lib/postgresql/certs/server.crt'
        -c ssl_key_file='/var/lib/postgresql/certs/server.key'
        -c ssl_min_protocol_version='TLSv1.2'
        -c hba_file='/etc/postgresql/pg_hba_external.conf'

volumes:
  pgdata:
