[vault]
name = "Research Base"
default_status = "draft"
research_dir = "research"

[search]
title_weight = 10.0
body_weight = 1.0
tags_weight = 5.0
aliases_weight = 3.0
boost_evergreen = 1.5
penalize_deprecated = 0.3
penalize_stale = 0.7

[web]
provider = "crawl4ai"
profile = "business-workspace"
magic = true

[sync]
auto_sync = true
# NOTE: exclude_patterns are only honored on the first path component.
# Subdirectory globs like "research/queue/*" are silently ignored — see
# hyperresearch/core/sync.py:_should_exclude. The workspace's queue dir
# lives at the repo root (`queue/`), outside the vault's scan root (`research/`),
# so it never enters the vault in the first place.
exclude_patterns = [".hyperresearch/*", "exports/*", ".git/*", ".venv/*", "node_modules/*", "templates/*", "CLAUDE.md", "AGENTS.md", "agents.md", "GEMINI.md", "README.md", "CHANGELOG.md"]

[index]
auto_build = true
pages = ["_index", "_tags", "_recent", "_orphans", "_stats"]
